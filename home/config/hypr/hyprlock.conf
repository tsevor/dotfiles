general {
	disable_loading_bar = true
	hide_cursor = true
	no_fade_in = false
}

background {
	monitor = DP-1
	path = ~/.config/hypr/images/bg1920x1200.png
	blur_passes = 3
	blur_size = 7
}

label {
	monitor = DP-1
	text = cmd[update:1000] echo "$(date +'%H:%M:%S')"
	color = rgb(e0e0e0)
	font_size = 64
	font_family = monospace
	position = 0, 100
	halign = center
	valign = center
	zindex = 5
}

input-field {
	monitor = DP-1
	size = 500, 50
	outline_thickness = 0
	dots_size = 0.6
	dots_spacing = 0.3
	dots_center = true
	outer_color = rgba(0, 0, 0, 0)
	inner_color = rgba(0, 0, 0, 0)
	font_color = rgb(e0e0e0)
	fade_on_empty = true
	placeholder_text =
	hide_input = false
	rounding = 0
	check_color = rgba(0, 0, 0, 0)
	fail_color = rgba(0, 0, 0, 0)
	fail_text =
	position = 0, -50
	halign = center
	valign = center
	zindex = 30
}

input-field {
	monitor = DP-1
	size = 250, 0
	outline_thickness = 26
	dots_size = 0.0
	outer_color = rgba(0, 0, 0, 0) rgba(224, 224, 224, 0.4) 270deg
	inner_color = rgba(0, 0, 0, 0)
	fade_on_empty = true
	placeholder_text =
	rounding = 0
	check_color = rgba(0, 0, 0, 0) rgba(119, 255, 204, 0.4) 270deg
	fail_color = rgba(0, 0, 0, 0) rgba(255, 204, 119, 0.4) 270deg
	capslock_color = rgba(0, 0, 0, 0) rgba(34, 34, 17, 0.4) 270deg
	numlock_color = rgba(0, 0, 0, 0) rgba(34, 17, 34, 0.4) 270deg
	position = 0, -72
	halign = center
	valign = center
	zindex = 20
}

input-field {
	monitor = DP-1
	size = 300, 6
	outline_thickness = 0
	dots_size = 0.0
	outer_color = rgba(0, 0, 0, 0)
	inner_color = rgb(e0e0e0)
	fade_on_empty = true
	placeholder_text =
	rounding = 100
	check_color = rgb(77ffcc)
	fail_color = rgb(ffcc77)
	capslock_color = rgb(222211)
	numlock_color = rgb(221122)
	position = 0, -100
	halign = center
	valign = center
	zindex = 10
}
