general {
	disable_loading_bar = true
	hide_cursor = true
	no_fade_in = false
}

auth {
	fingerprint {
		enabled = true
		retry_delay = 250
	}
}

background {
	monitor =
	path = ~/.config/hypr/images/bg/mountain3.png
	blur_passes = 2
	blur_size = 3
}

label {
	monitor =
	text = cmd[update:1000] echo "$(date +'%I:%M:%S')"
	color = rgb(e0e0e0)
	font_size = 64
	font_family = Overpass Mono Semibold
	position = 0, 20%
	halign = center
	valign = center
	zindex = 5
}

input-field {
	monitor =
	size = 1500, 50
	outline_thickness = 0
	dots_size = 0.6
	dots_spacing = 0.3
	dots_center = true
	outer_color = rgba(0, 0, 0, 0)
	inner_color = rgba(0, 0, 0, 0)
	font_color = rgb(e0e0e0)
	fade_on_empty = true
	placeholder_text =
	hide_input = false
	rounding = 0
	check_color = rgba(0, 0, 0, 0)
	fail_color = rgba(0, 0, 0, 0)
	fail_text =
	position = 0, 5%
	halign = center
	valign = center
	zindex = 30
}
