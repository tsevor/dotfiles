[main]
font=monospace:size=12
font-bold=monospace:style=Bold:size=12
font-italic=monospace:style=Italic:size=12
pad=8x4 center

[scrollback]
lines=2000

[colors-dark]
alpha=0.8
background=000000
foreground=cccccc

## regular colors
regular0=000000  # black
regular1=cc0000  # red
regular2=00cc00  # green
regular3=cccc00  # yellow
regular4=0077cc  # blue
regular5=cc00cc  # magenta
regular6=00cccc  # cyan
regular7=999999  # white

## bright colors
bright0=333333   # black
bright1=cc7777   # red
bright2=77ff77   # green
bright3=cccc99   # yellow
bright4=7799cc   # blue
bright5=cc77cc   # magenta
bright6=77cccc   # cyan
bright7=cccccc   # white
