<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

	<!-- monospace -->
	<match target="pattern">
		<test qual="any" name="family"><string>monospace</string></test>
		<edit name="family" mode="prepend" binding="strong">
			<string>OverpassM Nerd Font</string>
			<string>Noto Sans Mono</string>
			<string>Noto Sans Symbols</string>
			<string>Noto Sans Symbols 2</string>
			<string>Noto Sans Mono CJK JP</string>
			<string>Noto Sans Mono CJK KR</string>
			<string>Noto Sans Mono CJK SC</string>
			<string>Noto Sans Mono CJK TC</string>
			<string>Noto Sans Mono CJK HK</string>
		</edit>
	</match>

	<!-- sans serif -->
	<match target="pattern">
		<test qual="any" name="family"><string>sans-serif</string></test>
		<edit name="family" mode="prepend" binding="strong">
			<string>Noto Sans</string>
			<string>Noto Sans Symbols</string>
			<string>Noto Sans Symbols 2</string>
			<string>Noto Sans CJK JP</string>
			<string>Noto Sans CJK KR</string>
			<string>Noto Sans CJK SC</string>
			<string>Noto Sans CJK TC</string>
			<string>Noto Sans CJK HK</string>
		</edit>
	</match>

	<!-- serif -->
	<match target="pattern">
		<test qual="any" name="family"><string>serif</string></test>
		<edit name="family" mode="prepend" binding="strong">
			<string>Noto Serif</string>
			<string>Noto Serif Symbols</string>
			<string>Noto Serif Symbols 2</string>
			<string>Noto Serif CJK JP</string>
			<string>Noto Serif CJK KR</string>
			<string>Noto Serif CJK SC</string>
			<string>Noto Serif CJK TC</string>
			<string>Noto Serif CJK HK</string>
		</edit>
	</match>

	<!-- monospace aliases -->
	<match target="pattern">
		<test qual="any" name="family"><string>ui-monospace</string></test>
		<edit name="family" mode="prepend" binding="strong"><string>monospace</string></edit>
	</match>

	<match target="pattern">
		<test qual="any" name="family"><string>system-ui-monospace</string></test>
		<edit name="family" mode="prepend" binding="strong"><string>monospace</string></edit>
	</match>

	<match target="pattern">
		<test qual="any" name="family"><string>Fixed</string></test>
		<edit name="family" mode="prepend" binding="strong"><string>monospace</string></edit>
	</match>

	<!-- emoji fallbacks -->
	<match target="pattern">
		<test qual="any" name="family"><string>monospace</string></test>
		<edit name="family" mode="append" binding="weak"><string>Noto Color Emoji</string></edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family"><string>sans-serif</string></test>
		<edit name="family" mode="append" binding="weak"><string>Noto Color Emoji</string></edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family"><string>serif</string></test>
		<edit name="family" mode="append" binding="weak"><string>Noto Color Emoji</string></edit>
	</match>

</fontconfig>
